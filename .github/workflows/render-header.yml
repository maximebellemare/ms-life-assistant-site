name: Render public MS Life Assistant header PNG
on:
  push:
    branches: [main]
    paths:
      - header-source.svg
      - .github/workflows/render-header.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.7.1 Pillow==11.3.0
      - name: Render 3840 by 1646 opaque PNG
        run: |
          mkdir -p assets
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          output=Path('assets/MS-Life-Assistant-App-Store-Header-3840x1646.png')
          cairosvg.svg2png(url='header-source.svg',write_to=str(output),output_width=3840,output_height=1646)
          im=Image.open(output).convert('RGB')
          assert im.size==(3840,1646)
          im.save(output,optimize=True)
          print(output,output.stat().st_size)
          PY
      - name: Commit rendered header
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/MS-Life-Assistant-App-Store-Header-3840x1646.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish Apple App Store product page header image"
            git push origin HEAD:main
          fi